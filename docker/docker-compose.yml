services:
  db:
    image: pgvector/pgvector:pg18
    container_name: hr_postgres
    environment:
      POSTGRES_DB: hr_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sql@321
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  backend:
    build: ./backend
    container_name: hr_backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - POSTGRES_DB=hr_assistant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sql@321
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=True
      - RAG_SIMILARITY_THRESHOLD=0.7
      - RAG_RETRIEVAL_LIMIT=5
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app

# To migrate to pgvector:
# 1. Change db image to: pgvector/pgvector:pg18  (already done above)
# 2. Run: docker exec hr_postgres psql -U postgres -c "CREATE EXTENSION IF NOT EXISTS vector"
# 3. Alter DocumentChunk.embedding column from jsonb to vector(3072)
# 4. Convert existing JSONB embeddings to pgvector format:
#    UPDATE documents_documentchunk SET embedding = embedding::vector WHERE embedding IS NOT NULL;
# 5. Create HNSW index for performance:
#    CREATE INDEX ON documents_documentchunk USING hnsw (embedding vector_cosine_ops);

volumes:
  pg_data: